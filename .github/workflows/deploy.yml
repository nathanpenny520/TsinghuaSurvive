name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一个部署，避免并发上传互相覆盖
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # 站点页脚显示"最后更新于"，依赖完整 git 历史
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run check

      # 内容检查：死链、中文文件名、未来日期、占位符与过期核对日期。
      # 默认模式只把「真错误」当失败，占位符之类的债务只提示，不阻断部署。
      - name: 内容检查
        run: npm run check:content

      # 后台配置检查：确认后台声明的字段能装下所有 frontmatter。
      # 漏一个字段不会报任何错，但作者在后台保存一次就会把那个字段丢掉。
      - name: 后台配置检查
        run: npm run check:admin

      # 媒体检查（源码）：视频语法糖写法、外链图片是不是用了会失效的图床。
      # 这类问题构建查不出来：写法错了只是页面少一块，构建照样返回 0。
      - name: 媒体与视频检查
        run: npm run check:media

      # 课程索引与本地资料库（materials/，整理前是 reference/）的一致性。CI 上没有这些目录
      # （那是十几 GB 的本地参考资料），脚本检测不到就跳过并以 0 退出，不会误报。
      - name: 课程索引一致性
        run: npm run courses:check

      - name: 构建
        run: npm run build

      # 构建之后才能做的检查：结构化数据是否合法、分享卡片图有没有漏提交、
      # 加粗标记有没有被原样印到页面上。
      # 这几项都是「错了不会报错、只会静默失效」的类型，所以必须在部署前拦住。
      - name: 结构化数据检查
        run: npm run check:jsonld

      - name: 静态资源检查（分享卡片 / favicon / robots）
        run: npm run check:assets

      # `**加粗**` 紧贴全角标点（`**「图库」**`）时不会生效，星号会被原样印在页面上；
      # banner 只认 HTML 不认 Markdown；卡片文案漏调 descHtml() 也会这样。
      # 三种都「构建成功、页面照开」，只能数一遍产物里的可见文本。
      - name: 渲染文本检查（加粗标记有没有泄漏）
        run: npm run check:markup

      # 视频与图片的产物比对：数一遍产物里的视频容器和源码里的语法糖是否一致。
      # 必需，因为 Astro 的内容加载器出错时**构建仍然以 0 退出**，那一页正文会整个变空。
      - name: 媒体产物比对
        run: npm run check:media:dist

      # 凭证守卫：没有配 CLOUDFLARE_API_TOKEN 时给出明确提示并跳过部署，
      # 而不是抛一个看不懂的认证错误。
      - name: 检查部署凭证
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning title=跳过部署::仓库缺少 CLOUDFLARE_API_TOKEN，本次只构建不部署。配置步骤见 HANDOVER.md。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 部署到 Cloudflare Workers
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_ACCOUNT_ID  —— aa23021279f1ffd6901d7093879554f3（已配好）
#   CLOUDFLARE_API_TOKEN   —— 需要在 Cloudflare 控制台手动创建，权限清单见 HANDOVER.md
