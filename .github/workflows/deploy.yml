name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一个部署，避免并发上传互相覆盖
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # 站点页脚显示"最后更新于"，依赖完整 git 历史
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型与内容校验
        run: npm run check

      - name: 构建
        run: npm run build

      # 凭证守卫：没有配 CLOUDFLARE_API_TOKEN 时给出明确提示并跳过部署，
      # 而不是抛一个看不懂的认证错误。
      - name: 检查部署凭证
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning title=跳过部署::仓库缺少 CLOUDFLARE_API_TOKEN，本次只构建不部署。配置步骤见 HANDOVER.md。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 部署到 Cloudflare Workers
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_ACCOUNT_ID  —— aa23021279f1ffd6901d7093879554f3（已配好）
#   CLOUDFLARE_API_TOKEN   —— 需要在 Cloudflare 控制台手动创建，权限清单见 HANDOVER.md
